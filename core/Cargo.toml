[package]
name = "chimera-core"
version = "0.1.0"
edition = "2021"
authors = ["Project Chimera"]
description = "Sovereign L2 MEV execution engine - REVM simulation, pacing, routing"
license = "MIT"
repository = "https://github.com/your-org/project-chimera"

[dependencies]
# alloy 1.x — the modern all-in-one meta-crate (revm 36 requires alloy ^1.4)
alloy = { version = "1.7", features = ["full", "providers", "contract", "rpc"] }
async-trait = "0.1"
hex = "0.4"
revm = { version = "36.0", features = ["std", "serde", "alloydb"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
prometheus = "0.14"
dashmap = "6.0"
proptest = "1.4"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.35", features = ["serde"] }
anyhow = "1.0"
rand = "0.8"
parking_lot = "0.12"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
rust_decimal_macros = "1.35"

[[bin]]
name = "chimera"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
