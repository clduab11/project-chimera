[package]
name = "chimera-core"
version = "0.2.0"
edition = "2021"
authors = ["Project Chimera"]
description = "Sovereign L2 MEV execution engine - REVM simulation, pacing, routing"
license = "Proprietary"
repository = "https://github.com/clduab11/project-chimera"

[dependencies]
# alloy 1.x — the modern all-in-one meta-crate (revm 36 requires alloy ^1.4)
# NOTE: `full` already pulls `signer-local` (via `essentials`), but the keystore
# decrypt path (`PrivateKeySigner::decrypt_keystore`) requires the `signer-keystore`
# passthrough feature, which `full` does NOT enable. `signer-local`/`signers` are
# listed explicitly for clarity (they are real alloy features).
alloy = { version = "1.7", features = ["full", "providers", "contract", "rpc", "signers", "signer-local", "signer-keystore"] }
async-trait = "0.1"
hex = "0.4"
futures = "0.3"
revm = { version = "36.0", features = ["std", "serde", "alloydb"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
thiserror = "1.0"
prometheus = "0.14"
dashmap = "6.0"
proptest = "1.4"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.35", features = ["serde"] }
anyhow = "1.0"
rand = "0.9"
parking_lot = "0.12"
url = { version = "2", features = ["serde"] }

[features]
# Test-only injection hooks (mock simulator, mock gas price, single-scan entry
# point) consumed by the core/tests integration suite. OFF by default so the
# release binary carries NO mock-injection surface. The self path-dependency in
# [dev-dependencies] enables it automatically for the test build (dev-deps are
# excluded from release builds under workspace resolver "2"), so the documented
# gate `cargo test -p chimera-core` still needs no extra flags.
test-hooks = []

[dev-dependencies]
proptest = "1.4"
tempfile = "3.10"
rust_decimal_macros = "1.35"
# Self path-dependency: enables `test-hooks` for the test build only. Does not
# affect `cargo build`/`cargo build --release` (dev-dependencies are not compiled
# for those, and resolver "2" does not unify dev-dep features into normal builds).
chimera-core = { path = ".", features = ["test-hooks"] }

[[bin]]
name = "chimera"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
