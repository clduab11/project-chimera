[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"   # L2 modern

[lint]
exclude_lints = ["mixed-case-function", "mixed-case-variable", "screaming-snake-case-const", "screaming-snake-case-immutable", "pascal-case-struct"]
ignore = ["src/Executor.yul"]

[profile.ci]
verbosity = 4
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
