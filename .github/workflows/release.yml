name: Release

on:
  push:
    tags: ["v*"]

# Default to read-only; only the package job escalates to write below.
permissions:
  contents: read

jobs:
  version-check:
    name: Tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tag == chimera-core version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag $TAG != chimera-core version $PKG"; exit 1
          fi

  # Reuses the full PR-time gate set (cargo test, forge test, python syntax,
  # fmt/clippy lint, slither, cargo-audit, pip-audit, osv-scanner,
  # shadow-guard) so release gating can never drift from CI.
  ci:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml

  package:
    name: Build and publish release
    needs: [version-check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
      - name: Build chimera release binary
        run: cargo build --release -p chimera-core
      - name: Build contracts
        run: forge build --root contracts/
      - name: Assemble release bundle
        run: |
          BUNDLE="chimera-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "$BUNDLE"
          cp target/release/chimera "$BUNDLE/"
          cp LICENSE README.md CHANGELOG.md "$BUNDLE/"
          cp -r config "$BUNDLE/config"
          mkdir -p "$BUNDLE/contracts"
          cp contracts/out/Executor.yul/Executor.json "$BUNDLE/contracts/" 2>/dev/null || true
          tar -czf "$BUNDLE.tar.gz" "$BUNDLE"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: chimera-${{ github.ref_name }}-linux-x86_64.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
