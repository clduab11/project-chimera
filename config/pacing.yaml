# Project Chimera - Pacing Configuration (v1.0)
# Enforces hard risk-control volume caps and randomized release windows.
# All values in USD unless noted. Converted at runtime via on-chain oracles.

max_daily_net_usd: 2000
max_weekly_net_usd: 7500
max_single_transfer_usd: 1000

# Release window randomization (6-18h jitter to avoid deterministic patterns)
min_interval_hours: 6
max_jitter_hours: 12

# Venue & wallet rotation (prevents clustering)
venue_rotation_count: 5
clean_eoa_pool_size: 10

# Circuit breakers (auto-halt on anomalies)
auto_halt_on_reverts: 3          # Consecutive reverts before pause
max_gas_gwei: 300
max_daily_loss_eth: 0.005        # Hard stop on realized loss
min_profit_multiplier: 2.5       # Must clear gas + tip + L1 fees by this factor

# Operational
execute_mode: shadow             # shadow | live  (NEVER change without 7d validation)
log_level: info
metrics_port: 9100
chain_id: 8453                   # Base mainnet by default
# Must exceed the ETH/USD feed's on-chain heartbeat or the price reads "stale"
# between heartbeats. Base ETH/USD (0x71041d...) heartbeat = 1200s / 0.15%
# deviation (verified on-chain 2026-07-21: max inter-round gap 1232s over the
# last 12 rounds). 1500 = heartbeat + 300s transmission/clock margin.
oracle_staleness_seconds: 1500
# Conservative ETH/USD floor for gas-cost pacing when oracle is unreachable.
# Updated June 2026 based on ETH trading range. See Chainlink ETH/USD for live price.
# Sources: https://docs.chain.link/data-feeds/price-feeds/addresses?network=base
eth_price_usd_fallback: 1800
# Chainlink ETH/USD feed address for live gas-cost pricing. Configured per deployed chain.
# Base mainnet default: https://docs.chain.link/data-feeds/price-feeds/addresses?network=base
eth_usd_feed_address: "0x71041dddad3595F9CEd3DcCFBe3D1F4b0a16Bb70"
recent_outcomes_capacity: 128
eoa_pool_path: config/eoa_pool.json
pools_toml_path: config/pools.toml
# Operator runtime fields are intentionally empty in the checked-in shadow config.
# Set them through CHIMERA_* environment variables or a deployment-local config before live startup.
executor_address: ""
treasury_address: ""
treasury_keystore: ""
worker_keystore_dir: ""
sweep_interval_secs: 900        # eth_getBalance is the single largest RPC method by volume;
                                # between trades this is pure overhead.
refund_interval_secs: 3600
min_worker_balance_eth: 0.002
refund_topup_eth: 0.01
sweep_tokens: []
sweep_min_keep_eth: 0.001
ws_endpoint: ""

# --- Atomic Bundle configuration ---
# Priority fee multiplier for deterministic inclusion (default: 3x base fee)
atomic_priority_multiplier: 3
# Maximum gas price willing to pay for atomic bundle legs (gwei)
atomic_max_gas_gwei: 50000
# Minimum slippage threshold in basis points for target selection (100 = 1%)
atomic_min_slippage_bps: 100
# Maximum blocks to wait for bundle inclusion
atomic_max_wait_blocks: 6
# Estimated gas per swap leg for atomic bundle execution
atomic_swap_gas_estimate: 150000
