[advisories]
ignore = [
    # tracing-subscriber ANSI escape injection (Low). Logs are local/operator-only;
    # no untrusted terminal sink. Re-evaluate on tracing-subscriber upgrade.
    "RUSTSEC-2025-0055",
    # protobuf 2.x DoS (Medium), transitive via prometheus 0.14 -> protobuf.
    # Reachability: protobuf is only used to ENCODE our own metrics for the local
    # Prometheus endpoint; we never DECODE untrusted protobuf input, so the DoS
    # vector (malicious input to parsing) is not reachable in our usage. Risk-accepted
    # until prometheus pulls protobuf >=3.7.2. Tracked: RUSTSEC-2024-0437.
    "RUSTSEC-2024-0437",
    "RUSTSEC-2024-0388",  # derivative unmaintained - transitive dependency
    "RUSTSEC-2024-0436",  # paste unmaintained - transitive dependency
    "RUSTSEC-2026-0173",  # proc-macro-error2 unmaintained - transitive dependency
    "RUSTSEC-2026-0185",  # quinn-proto - transitive dependency
    "RUSTSEC-2026-0190",  # anyhow - transitive dependency
]
