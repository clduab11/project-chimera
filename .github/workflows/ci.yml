name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Also invoked as a reusable workflow by release.yml so the tag-time gate
  # set is definitionally identical to the PR-time gate set.
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test -p chimera-core
        working-directory: ./core

  forge:
    name: Solidity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge install
        run: forge install
        working-directory: ./contracts
      - name: forge test
        run: forge test
        working-directory: ./contracts

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall scripts ai-audit/scripts

  cargo-audit:
    name: Rust dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # cargo audit reads ignores from .cargo/audit.toml at the repo root.
      # Exits non-zero on any non-ignored advisory, failing the build.
      - name: Run cargo audit
        run: cargo audit

  slither:
    name: Solidity static analysis (slither)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install slither
        run: pip install slither-analyzer
      - name: Exclude Yul sources for slither compatibility
        run: |
          mkdir -p /tmp/yul-backup
          find contracts/src -name '*.yul' -exec mv {} /tmp/yul-backup/ \;
      - name: forge build
        run: forge build --root contracts/
      - name: Run slither
        run: slither contracts --config-file slither.config.json --fail-high
      - name: Restore Yul sources
        if: always()
        run: |
          find /tmp/yul-backup -name '*.yul' -exec mv {} contracts/src/ \; 2>/dev/null || true

  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy -p chimera-core --all-targets -- -D warnings

  pip-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      # Exits non-zero on any known vulnerability in requirements.txt.
      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  # Scans the lockfiles that exist in this repo (Cargo.lock, requirements.txt).
  # There is no package-lock.json, so no JS lockfile is scanned.
  # Reads ignore rules from osv-scanner.toml at the repo root.
  osv-scanner:
    name: Multi-ecosystem lockfile scan (osv-scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.1
      - name: Run osv-scanner
        run: osv-scanner --lockfile=Cargo.lock --lockfile=requirements.txt

  shadow-guard:
    name: Forbid live execute_mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid execute_mode live in committed config/fixtures
        run: |
          if grep -RInE 'execute_mode:\s*["'\'']?live' config/ core/tests/ 2>/dev/null; then
            echo "ERROR: execute_mode: live found in committed config/fixtures"; exit 1; fi
          echo "OK: no committed live execute_mode"
      - name: Forbid tranche_enabled true in committed config/fixtures
        run: |
          if grep -RInE 'tranche_enabled:\s*["'\'']?true' config/ core/tests/ 2>/dev/null; then
            echo "ERROR: tranche_enabled: true found in committed config/fixtures"; exit 1; fi
          echo "OK: no committed tranche_enabled true"
      - name: Forbid an Ethereum L1 bundle relay in committed config/fixtures
        run: |
          if grep -RInE '(rpc|relay|protect)\.flashbots\.net' config/ 2>/dev/null; then
            echo "ERROR: L1 Flashbots relay found in committed config/ — no bundle relay serves Base (8453)"; exit 1; fi
          echo "OK: no committed L1 relay endpoint"
